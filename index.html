<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Caftan Prestige</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background-color: #f5f0e6;
}

header {
    background: #e8dcc7;
    padding: 15px;
    text-align: center;
    position: relative;
}

.logo {
    position: absolute;
    right: 15px;
    top: 10px;
    cursor: pointer;
}

.cart {
    position: fixed;
    left: 0;
    top: 0;
    width: 180px;
    height: 100%;
    background: #d9cbb0;
    padding: 10px;
}

.content {
    margin-left: 200px;
    padding: 20px;
}

.search {
    width: 250px;
    padding: 5px;
}
</style>

</head>

<body>

<header>
    <input class="search" placeholder="Rechercher...">
    <div class="logo" onclick="home()">🏠</div>
</header>

<div class="cart">
    <h3>🛒 Panier</h3>
    <p>Vide</p>
</div>

<div class="content">
    <h1>Caftan Prestige ✨</h1>
    <p>Bienvenue sur ta boutique</p>
</div>

<script>
function home() {
    window.scrollTo(0,0);
}
</script>

</body>
</html>
